name: Superself
description: The open Company State Runtime — what your company intends, has decided, is doing, and can prove, readable by any agent, any session, any tool.
root: site
url: https://superselfs.com
repo: https://github.com/fxylabs/superself
locale: en
social:
  github: https://github.com/fxylabs/superself
  npm: https://www.npmjs.com/package/superself
footerNote: © 2026 FXY Inc. · Apache-2.0
# Opt-in visitor analytics: the layouts inject the PostHog loader into every
# mounted page. The key is the public client-token class that ships in every
# page by design; the raw landing (site/pages/index.html) inlines the same
# loader because raw HTML pages are served verbatim, outside the layouts.
analytics:
  posthog:
    key: phc_sg3X7M6CtErmTgKkAk5ajcJbJyCCZsFkmVhikdjr4SLt
nav:
  - label: Docs
    path: /docs/guides/getting-started
  - label: Roadmap
    path: /docs/roadmap
# Repo docs are the site's docs: one source, read on the site instead of on
# GitHub. README files collapse onto their directory route.
mounts:
  - source: docs/guides
    route: /docs/guides
    title: Guides
  - source: docs/concepts
    route: /docs/concepts
    title: Concepts
  - source: docs/reference
    route: /docs/reference
    title: Reference
  - source: docs/examples
    route: /docs/examples
    title: Examples
  - source: docs/updates
    route: /updates
    title: Updates
  - source: docs/roadmap.md
    route: /docs/roadmap
    title: Roadmap
  - source: CONTRIBUTING.md
    route: /docs/contributing
    title: Contributing
  - source: ARCHITECTURE.md
    route: /docs/architecture
    title: Architecture
