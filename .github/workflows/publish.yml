name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release for the tag being published
  id-token: write # npm Trusted Publishing (OIDC) — no token secret

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # node 22 bundles npm 10; OIDC publishing needs npm 11.5+
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: The tag must name the version being published
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package version $PKG" >&2
            exit 1
          fi
      # prepublishOnly runs the full proof before anything uploads
      - run: npm publish
        working-directory: apps/cli
      # The registry, not the workflow, is the authority on what shipped: a
      # publish that lands a different version must not leave a release behind.
      - name: The registry must serve the version that was tagged
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISHED="$(npm view "superself@$VERSION" version)"
          if [ "$PUBLISHED" != "$VERSION" ]; then
            echo "npm serves $PUBLISHED for $GITHUB_REF_NAME, not $VERSION" >&2
            exit 1
          fi
      # A published package with no visible release leaves the delivery
      # lifecycle unable to prove the release step ever happened.
      - name: Publish the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag $PRERELEASE
