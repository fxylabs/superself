name: DCO

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Require a matching sign-off on every commit
        uses: actions/github-script@v7
        with:
          script: |
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const normalize = (value) => value.trim().replace(/\s+/g, ' ').toLowerCase();
            const signoffPattern = /^Signed-off-by:\s*(.+?)\s*<([^<>\s]+@[^<>\s]+)>\s*$/gim;
            const failures = [];

            for (const commit of commits) {
              const expectedIdentities = [commit.commit.author, commit.commit.committer]
                .filter((identity) => identity?.name && identity?.email)
                .map((identity) => normalize(`${identity.name} <${identity.email}>`));
              const signoffs = [...commit.commit.message.matchAll(signoffPattern)]
                .map((match) => normalize(`${match[1]} <${match[2]}>`));

              if (!signoffs.some((signoff) => expectedIdentities.includes(signoff))) {
                failures.push(commit.sha.slice(0, 12));
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                `Every commit must include a Signed-off-by trailer matching its author or committer. Missing or mismatched: ${failures.join(', ')}`,
              );
              return;
            }

            core.info(`All ${commits.length} commit(s) satisfy the DCO policy.`);
