name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The structure check diffs against the merge base with main. A
          # shallow clone has none, and a check with no base passes everything
          # while reading as a clean repository.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first, not second. The CLI typechecks against `@superself/fold`'s
      # declarations, and a `--noEmit` typecheck does not produce them — so on a
      # clean checkout there is nothing for it to read until the package has
      # been built once.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm structure
      # The two packages are published from one tag and depend on each other by
      # version, so what can be wrong about them is a thing neither package's
      # own suite can see: a pin that does not resolve, a `files` field that
      # dropped `dist/`, a bin the tarball stripped the executable bit from.
      # Running it here means a broken pairing is a red pull request rather
      # than something found on the publish path.
      - run: pnpm smoke
