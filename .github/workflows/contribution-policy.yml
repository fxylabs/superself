name: Contribution policy

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  contribution-policy:
    runs-on: ubuntu-latest
    steps:
      # This workflow intentionally inspects metadata only. Never check out or
      # execute code from the pull request in a pull_request_target workflow.
      - name: Require an accepted issue, assignment, and matching branch
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body ?? '';
            const closingReference = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?[ \t]*#(\d+)\b/gi;
            const issueNumbers = [...body.matchAll(closingReference)]
              .map((match) => Number(match[1]))
              .filter((number, index, values) => values.indexOf(number) === index);

            if (issueNumbers.length === 0) {
              core.setFailed('Add a closing issue reference such as `Closes #123` to the pull request body.');
              return;
            }

            if (issueNumbers.length !== 1) {
              core.setFailed('Each pull request must close exactly one issue.');
              return;
            }

            const author = context.payload.pull_request.user.login;
            const baseBranch = context.payload.pull_request.base.ref;
            const headBranch = context.payload.pull_request.head.ref;
            const failures = [];

            if (baseBranch !== 'main') {
              failures.push(`Pull requests must target \`main\`, not \`${baseBranch}\`.`);
            }

            const branchPattern = /^(feat|fix|docs|refactor|test|chore)\/(\d+)-[a-z0-9]+(?:-[a-z0-9]+)*$/;
            const branchMatch = headBranch.match(branchPattern);
            if (!branchMatch) {
              failures.push(`Branch \`${headBranch}\` must match \`<type>/<issue-number>-<short-description>\`.`);
            } else if (Number(branchMatch[2]) !== issueNumbers[0]) {
              failures.push(`Branch \`${headBranch}\` must contain closing issue number #${issueNumbers[0]}.`);
            }

            for (const issueNumber of issueNumbers) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                }));
              } catch (error) {
                if (error.status === 404) {
                  failures.push(`#${issueNumber} does not exist in this repository.`);
                  continue;
                }
                throw error;
              }

              if (issue.pull_request) {
                failures.push(`#${issueNumber} is a pull request, not an issue.`);
                continue;
              }

              if (issue.state !== 'open') {
                failures.push(`#${issueNumber} must be open when the pull request is submitted.`);
              }

              const labels = issue.labels.map((label) =>
                typeof label === 'string' ? label : label.name,
              );
              if (!labels.includes('status:accepted')) {
                failures.push(`#${issueNumber} does not have the \`status:accepted\` label.`);
              }

              const assignees = issue.assignees?.map((assignee) => assignee.login) ?? [];
              if (!assignees.includes(author)) {
                failures.push(`@${author} is not assigned to #${issueNumber}.`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('\n'));
              return;
            }

            core.info(`Contribution policy satisfied by ${issueNumbers.map((number) => `#${number}`).join(', ')}.`);
