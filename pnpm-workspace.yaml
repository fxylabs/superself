packages:
  - apps/*

# Vite 8/Rolldown and esbuild ship native binaries as optional dependencies.
# Keep installs reproducible for local macOS development and Linux CI.
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl

onlyBuiltDependencies:
  - esbuild

# The CLI depends on `@superself/fold` by its real version rather than through
# the workspace protocol, so the tarball npm publishes is installable as it
# stands. This setting is what keeps the development loop unchanged: a
# dependency a workspace package already satisfies is linked from `apps/`
# rather than fetched.
linkWorkspacePackages: true
