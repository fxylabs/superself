packages:
  - apps/*
  - tools/*

# Vite 8/Rolldown and esbuild ship native binaries as optional dependencies.
# Keep installs reproducible for local macOS development and Linux CI.
supportedArchitectures:
  os:
    - current
    - darwin
    - linux
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl

onlyBuiltDependencies:
  - esbuild
