<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">작업 계획 리뷰부터 완료까지의 역할과 상태 변화</title>
  <desc id="desc">사용자, work, 에이전트 세 줄에서 계획 제안, 리뷰 수정, 승인 실행, 보고 완료가 왼쪽에서 오른쪽으로 이어진다.</desc>
